"$\",\"$L1d\",null,{}]}]\nf:[\"$\",\"style\",null,{\"suppressHydrationWarning\":true,\"dangerouslySetInnerHTML\":{\"__html\":\"\\n              @keyframes gradientMove { \\n                0% { background-position: 0% 50%; } \\n                50% { background-position: 100% 50%; } \\n                100% { background-position: 0% 50%; } \\n              }\\n            \"}}]\n10:[\"$\",\"div\",null,{\"className\":\"hidden md:block\",\"children\":[\"$\",\"$L1e\",null,{}]}]\n11:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L7\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L8\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n20:T324e,"])</script><script>self.__next_f.push([1,"### 简介\n*AueXUE* 是一个基于cloudflare进行托管，使用R2作为储存源，D1作为数据库的现代化动态博客项目，无需每次更改重新部署项目，实时预览你的更改，同时配套专属obsidian插件，方便在obsidian管理和发布文章，配有一键发布文章的功能，在obsidian打开对应文章点击发布即可直接将文档发布到云端并返回分享链接\n#### 网站预览\n网站样式预览可以前往 **https://daily.yybb.us** 该站点是基于hugo重构，ui界面保持一致，如果对这个感兴趣的话，请看 [Hugo最美主题-aiovtue](posts/hugoTheme-aiovtue)\n这里也放几张站点的截图方便预览\n![](https://r2tc.20030327.xyz/file/%E5%8D%9A%E5%AE%A2/%E6%96%87%E7%AB%A0/1782137472842_6a3938ff4a893629d992bb61.png)\n![](https://r2tc.20030327.xyz/file/%E5%8D%9A%E5%AE%A2/%E6%96%87%E7%AB%A0/1780923255231_1780923153704.png)\n具体还是前往站点亲自体验比较好，下面是站点后台管理的样式，这个无法体验，我多几张\n![登陆页面](https://r2tc.20030327.xyz/file/%E5%8D%9A%E5%AE%A2/%E6%96%87%E7%AB%A0/NBxHR4aV.png)\n![文章页面](https://r2tc.20030327.xyz/file/%E5%8D%9A%E5%AE%A2/%E6%96%87%E7%AB%A0/QlXxCaTn.png)\n![友链管理](https://r2tc.20030327.xyz/file/%E5%8D%9A%E5%AE%A2/%E6%96%87%E7%AB%A0/Uvnt7X7L.png)\n\n### 自定义\n#### 页面\n下面是各个页面的自定义部分位置，首先是文章，由于文章储存在云端，但是在部署的时候会进行一次文章迁移，会将本地文章迁移至云端，因此，本地调试时可以加上想写的文章，不过后续更新文章不要使用这种方式，直接在后台管理即可，具体路径是`\\AueXUE\\content\\posts`文件夹，默认放了两篇文章\n同样的，在`\\AueXUE\\content`文件夹内部还有关于页，相册页，友链页以及公告栏等页面的相关配置，修改相关页面头图标题之类的找到对应`index.md`文件修改即可\n#### 其他页面\n部分页面只有静态文件，没有放在云端，后续也只需要修改一次，上面那些页面基本都是能在后台管理的，本地改不改都行，只是首次会进行同步，但是这部分的页面并不是，只是一次性的，静态文件，不支持后台修改，但是基本只需要修改一次，使用没有集成到后台，具体路径是`\\AueXUE\\pages`文件夹下各文件夹，包括分类，标签，等页面，注意，后缀为`.vue`的文件不要修改，只需要找到相应的`index.md`文件修改即可\n\n#### 站点信息\n站点信息分布在两个地方，涵盖两个文件`site.config.ts`和`valaxy.config.ts`\n`site.config.ts`文件包含内容如下：\n\u003e 站点地址\n\u003e 站点标题\n\u003e 站点头像\n\u003e 站点图标\n\u003e 社交图标\n\u003e 打赏信息\n\n`valaxy.config.ts`文件包含内容如下：\n\u003e 主题色\n\u003e 导航页视频链接\n\u003e 默认文章封面\n\u003e 首页头图文字、背景\n\u003e 顶栏信息\n\u003e 侧边栏信息\n\u003e 页脚计时起始时间\n\u003e 页脚备案信息\n\u003e 归档页图表起始时间\n\u003e 评论配置（twikoo）\n\n大部分应该都写上去了，可能会漏掉一些~\n#### 友链公告\n这部分比较特殊，被写死了，所以没再配置文件里面，具体修改位置在`\\AueXUE\\components\\FriendLinkNotice.vue`文件内，具体位置在\n```\n          本站友链信息如下：\n        \u003c/p\u003e\n        \u003cul class=\"friend-link-site-info__list\"\u003e\n          \u003cli\u003e\n            站点名称：\u003cspan class=\"friend-link-highlight\"\u003eAIOVTUE-雪\u003c/span\u003e\n          \u003c/li\u003e\n          \u003cli\u003e\n            站点链接：\u003cspan class=\"friend-link-highlight\"\u003ehttps://live.yybb.us\u003c/span\u003e\n          \u003c/li\u003e\n          \u003cli\u003e\n            站长头像：\u003cspan class=\"friend-link-highlight\"\u003e{{ siteInfo.avatar }}\u003c/span\u003e\n          \u003c/li\u003e\n          \u003cli\u003e\n            站点描述：\u003cspan class=\"friend-link-highlight\"\u003e雨滴会记录生命中的每一个瞬间\u003c/span\u003e\n          \u003c/li\u003e\n          \u003cli\u003e\n            站点截图：\u003cspan class=\"friend-link-highlight\"\u003ehttps://r2tc.20030327.xyz/file/博客/主题/1780909850378_1780909790262.png\u003c/span\u003e\n          \u003c/li\u003e\n```\n具体在这部分，正常情况会自动获取站点配置，但是部分信息得自己改，修改很简单，直接把对应文字或者链接改为自己的即可\n\n### 部署\n#### 本地部署预览\n##### 环境变量\n部署之前需要配置环境变量，先将根目录`.dev.vars.example`文件复制一份，重命名为`.dev.vars`，然后在里面按需配置信息即可，包含如下内容\n```\nWEBDAV_PASSWORD=你的webdav密码\nADMIN_USERNAME=admin\nADMIN_PASSWORD=admin123\nADMIN_API_TOKEN=yourAPItoken\nSITE_URL=https://你的网站地址\n```\nwebdav密码，不使用云端相册可以不配置，账号密码必须要，否则打不开后台，apiToken尽量配置长一点复杂一点，用来在obsidian插件进行认证，请务必不要泄露这些信息，上传github仓库也请不要将环境变量一起上传，或者干脆将仓库设为私有，最保险\n##### 安装依赖\n使用命令安装依赖\n```\npnpm install\n```\n或者\n```\nnpm install\n```\n可能需要特殊网络环境，注意最好使用管理员身份打开终端，不然容易报错\n\n##### 运行预览\n预览命令如下\n\n| 命令                    | 端口   | 说明                                                  |\n| --------------------- | ---- | --------------------------------------------------- |\n| `npm run dev`         | 4859 | Vite 热更新；API 走本地 `content/` 插件，**与云端行为不完全一致**       |\n| `npm run dev:cf`      | 8788 | **推荐**：构建 + 本地 D1/R2 迁移 + `wrangler pages dev`，等同云端 |\n| `npm run dev:cf:lite` | 8788 | 仅重建前端并启动 wrangler，**跳过数据迁移**（改样式/UI 时用）             |\n说一下区别，`npm run dev:cf`命令是本地全量预览，会进行数据转移，即将本地文章转移到本地预览R2和数据库中，`npm run dev:cf:lite`这个命令和上一个命令一样，但是会跳过数据迁移部分，大大加快预览速度，首次建议`npm run dev:cf`，后续使用`npm run dev:cf:lite`即可\n要是想删除本地数据库数据，可以使用后台手动删除，也可以直接删除`AueXUE\\.wrangler\\state`\n文件夹下所有文件，然后重新执行全量命令即可。\n\n#### 云端部署\n云端部署分为两种方式，终端部署和网页部署，终端部署比较简单，推荐终端\n##### 终端部署\n###### 步骤 1：创建 Cloudflare 资源\n运行如下命令创建数据库和R2，当然也可以使用网页手动创建，需要先登陆wrangler，登陆命令为`wrangler login`，没安装的话使用命令安装`npm install -g wrangler`\n登录后运行下列命令创建数据库和R2\n```shell\n# 创建 D1 数据库\nnpx wrangler d1 create aiovtue-blog\n\n# 创建 R2 存储桶\nnpx wrangler r2 bucket create aiovtue-blog\n\n# 创建 Pages 项目（若尚未创建）\nnpx wrangler pages project create aiovtue-blog --production-branch main\n```\n\n将 `d1 create` 输出的 `database_id` 填入 `wrangler.toml` 的 `database_id` 字段。\n `wrangler.toml` 文件位于根目录下，需要填入对应的数据库id，如果修改了数据库名称等东西也要一起修改\n \n###### 步骤 2：应用 D1 表结构\n运行如下命令即可\n```\nnpm run d1:migrate\n```\n等价于：\n```\nnpx wrangler d1 migrations apply aiovtue-blog --remote\n```\n\n数据库迁移文件位于 `migrations/`，包含如下文件：\n1. `0001_posts.sql` — 文章表 + FTS\n2. `0002_taxonomy.sql` — 分类/标签表\n3. `0003_pin_order.sql` — 置顶字段\n4. `0004_notice.sql` — 公告栏\n5. `0005_admin_login_attempts.sql` — 登录限速\n\n###### 步骤 3：同步内容到 R2 + D1\n运行如下命令同步数据，一行一行运行\n```shell\nnpm run migrate:posts\nnpm run migrate:links\nnpm run migrate:about\nnpm run migrate:gallery\nnpm run migrate:notice\n```\n\n###### 步骤 4：配置 Pages 环境变量\n在 Cloudflare Dashboard → **Workers \u0026 Pages** → **aiovtue-blog** → **Settings** → **Environment variables** 中添加如下环境变量，和`.dev.vars`文件中的变量一样：\n\n|变量名|类型|说明|\n|---|---|---|\n|`ADMIN_USERNAME`|变量|后台登录用户名|\n|`ADMIN_PASSWORD`|**Secret**|后台登录密码|\n|`ADMIN_API_TOKEN`|**Secret**（推荐）|API 调用令牌，建议与登录密码不同|\n|`WEBDAV_PASSWORD`|**Secret**（可选）|相册 WebDAV 代理密码|\n|`SITE_URL`|变量|站点主 URL，如 `https://daily.yybb.us`|\n\n`wrangler.toml` 中 `[vars]` 的 `SITE_URL` 用于构建默认值；生产环境建议在 Dashboard 覆盖为你的自定义域名\n\n###### 步骤 5：构建并部署\n使用如下命令构建部署，一行一行运行\n```shell\nnpm run build\nnpx wrangler pages deploy dist --project-name aiovtue-blog --commit-dirty=true\n```\n执行完之后就能在cloudflare的项目列表看到该项目了，此时就能进行访问了\n###### 步骤 6：绑定自定义域名（可选）\nCloudflare Dashboard → Pages 项目 → **Custom domains** → 添加 `daily.yybb.us` 等域名，按提示配置 DNS\n要和下列文件中的url保持一致哦，不一致的话请绑定配置好后重新运行部署命令部署一下：\n- `site.config.ts` 中的 `url`\n- `wrangler.toml` 中 `SITE_URL`（或 Dashboard 环境变量）\n\n\n##### 网页部署\n部署前需要修改`wrangler.toml` 文件对应内容，确保cloudflare的D1和R2信息正确，也就是说要先创建数据库这些\n###### 登录并进入 Pages\n1. 打开 [Cloudflare Dashboard](https://dash.cloudflare.com/)\n2. 左侧选择 **Workers 和 Pages**（Workers \u0026 Pages）\n3. 若已有项目，点击 **aiovtue-blog**；否则点击 **创建** → **Pages** → **连接到 Git**\n\n###### 创建项目（关联 Git）\n1. 选择 **连接到 Git**，授权 GitHub/GitLab\n2. 选中本仓库 `AueXUE`\n3. 点击 **开始设置**，填写构建配置：\n\n|配置项|填写内容|\n|---|---|\n|项目名称|`aiovtue-blog`|\n|生产分支|`main`（或你的主分支）|\n|框架预设|`None`（无预设）|\n|构建命令|`npm run build`|\n|构建输出目录|`dist`|\n|根目录|`/`（仓库根目录）|\n\n4. 点击 **环境变量** → **添加变量**（见下文「四、配置环境变量」），也可以先保存后面在添加，然后 **保存并部署**\n\n###### 绑定 D1 与 R2\n部署完成后，进入项目 **aiovtue-blog** → **设置（Settings）** → **函数（Functions）** → **绑定（Bindings）**：\n添加 D1 数据库绑定\n1. 点击 **添加** → **D1 database**\n2. 变量名填：`DB`（必须与 `wrangler.toml` 一致）\n3. 选择数据库：`aiovtue-blog`\n4. 保存\n\n若列表中没有 D1，需先到 **Storage \u0026 databases** → **D1** → **创建数据库**，名称 `aiovtue-blog`。\n添加 R2 存储桶绑定\n1. 点击 **添加** → **R2 bucket**\n2. 变量名填：`BUCKET`\n3. 选择存储桶：`aiovtue-blog`\n4. 保存\n\n若尚无 R2，到 **R2** → **创建存储桶**，名称 `aiovtue-blog`\n\n\u003e 绑定修改后，需在 **部署（Deployments）** 中 **重新部署** 一次生产环境，新绑定才会生效。\n\n---\n\n###### 配置环境变量\n路径：**设置** → **环境变量（Variables and Secrets）** → **添加**如下变量，和`.dev.vars`文件内变量一致\n\n|变量名|类型|生产环境值示例|\n|---|---|---|\n|`ADMIN_USERNAME`|文本（Variable）|你的后台用户名|\n|`ADMIN_PASSWORD`|加密（Secret）|你的后台密码|\n|`ADMIN_API_TOKEN`|加密（Secret）|随机长字符串（与密码不同）|\n|`WEBDAV_PASSWORD`|加密（Secret）|相册 WebDAV 密码（可选）|\n|`SITE_URL`|文本（Variable）|`https://daily.yybb.us`|\n\n- 修改环境变量后，点击 **重新部署** 使配置生效\n\n###### 在控制台执行 D1 数据库迁移\n关联 Git 不会自动执行 `migrations/` 里的 SQL，**首次部署**或**有新迁移文件**时需处理表结构。\n1. Dashboard → **Storage \u0026 databases** → **D1** → 选择 **aiovtue-blog**\n2. 打开 **控制台（Console）** 标签\n3. 将 `migrations/` 下各 `.sql` 文件内容**按编号顺序**粘贴执行：\n    - `0001_posts.sql`\n    - `0002_taxonomy.sql`\n    - `0003_pin_order.sql`\n    - `0004_notice.sql`\n    - `0005_admin_login_attempts.sql`\n\n即使用文档软件打开上面的文件，复制其中的内容，粘贴到cloudflare网页端数据库终端中运行即可，每个文件都要运行一遍，注意要按顺序运行，一次一个\n\n###### 步骤 6：绑定自定义域名（可选）\nCloudflare Dashboard → Pages 项目 → **Custom domains** → 添加 `daily.yybb.us` 等域名，按提示配置 DNS\n要和下列文件中的url保持一致哦，不一致的话请绑定配置好后重新运行部署命令部署一下：\n- `site.config.ts` 中的 `url`\n- `wrangler.toml` 中 `SITE_URL`（或 Dashboard 环境变量）"])</script><script>self.__next_f.push([1,"21:T1d6b,"])</script><script>self.__next_f.push([1,"# 📝 Blog CMS — Hugo + Decap CMS 博客系统\n\n一个功能完整的现代博客系统，支持后台管理、多平台部署。\n\n## ✨ 特性\n\n- **📝 后台管理** — Decap CMS 后台直接编写文章、管理页面\n- **🔐 帐号密码登录** — Cloudflare Pages Functions 认证\n- **🎨 主题切换** — 亮色 / 暗色 / 自动跟随系统\n- **🔍 全文搜索** — 内置搜索功能\n- **📱 响应式设计** — 完美适配所有设备\n- **🚀 多平台部署** — Cloudflare Pages / Vercel / GitHub Pages\n- **📁 Markdown 编写** — 简洁高效的内容创作\n- **🔧 后台配置** — 通过后台修改主题、菜单、网站设置\n\n## 🛠️ 技术栈\n\n| 组件 | 技术 |\n|------|------|\n| 静态站点生成 | [Hugo](https://gohugo.io/) |\n| 后台管理 | [Decap CMS](https://decapcms.org/) |\n| 认证服务 | [Cloudflare Pages Functions](https://developers.cloudflare.com/pages/functions/) |\n| 主题 | [PaperMod](https://github.com/adityatelange/hugo-PaperMod/) |\n| 部署 | Cloudflare Pages / Vercel / GitHub Pages |\n\n## 🚀 快速开始\n\n### 1. 克隆项目\n\n```bash\ngit clone https://github.com/fbwe425/blog-cms.git\ncd blog-cms\n```\n\n### 2. 部署到 Cloudflare Pages\n\n1. 登录 [Cloudflare Dashboard](https://dash.cloudflare.com)\n2. 进入 **Workers \u0026 Pages** → **Create** → **Pages** → **Connect to Git**\n3. 选择 GitHub → 授权 → 选择 **blog-cms** 仓库\n4. 配置构建：\n\n| 设置项 | 值 |\n|--------|-----|\n| Branch | `main` |\n| Build command | `hugo --minify` |\n| Build output directory | `public` |\n\n5. 在 **Settings** → **Functions** 中添加 KV 绑定：\n   - `SESSIONS` → 选择或创建 KV 命名空间\n   - `AUTH_CREDENTIALS` → 选择或创建 KV 命名空间\n\n6. 点击 **Save and Deploy**\n\n### 3. 设置管理员帐号\n\n在 Cloudflare Dashboard 中：\n\n1. 进入 **Workers \u0026 Pages** → **你的项目** → **Settings** → **Functions** → **KV namespace bindings**\n2. 点击 **Edit variables**，获取 KV 命名空间 ID\n3. 使用 Wrangler CLI 或 API 设置管理员帐号：\n\n```bash\n# 安装 Wrangler\nnpm install -g wrangler\n\n# 登录\nwrangler login\n\n# 设置管理员帐号\nwrangler kv:key put --binding=AUTH_CREDENTIALS \"admin\" '{\"username\":\"admin\",\"password\":\"你的密码\"}'\n```\n\n### 4. 访问后台\n\n1. 打开 `https://你的站点.pages.dev/admin/`\n2. 输入管理员帐号和密码\n3. 登录成功后即可使用后台管理\n\n## 📁 项目结构\n\n```\nblog-cms/\n├── functions/                 # Cloudflare Pages Functions\n│   └── api/\n│       ├── login.js           # 登录处理\n│       ├── auth.js            # Session 验证\n│       └── logout.js          # 登出处理\n├── content/                   # 博客内容\n│   ├── posts/                 # 博客文章\n│   └── pages/                 # 独立页面\n├── static/                    # 静态文件\n│   ├── admin/                 # Decap CMS 管理面板\n│   │   ├── index.html         # CMS 入口（含登录界面）\n│   │   └── config.yml         # CMS 配置\n│   └── css/                   # 自定义样式\n├── layouts/                   # Hugo 布局模板\n├── data/                      # 数据文件（主题/导航配置）\n├── archetypes/                # 内容原型\n├── hugo.toml                  # Hugo 配置\n├── vercel.json                # Vercel 部署配置\n├── docs/                      # 部署文档\n└── README.md\n```\n\n## 📦 其他部署方式\n\n### Vercel\n\n1. 登录 [vercel.com](https://vercel.com)\n2. Import GitHub 仓库\n3. Framework: Hugo\n4. Build command: `hugo --minify`\n5. Output: `public`\n\n### GitHub Pages\n\n项目已包含 GitHub Actions 配置（`.github/workflows/deploy-github-pages.yml`）：\n\n1. 进入仓库 Settings → Pages\n2. Source 选择 **GitHub Actions**\n3. 推送到 `main` 分支自动部署\n\n## 🎨 后台功能\n\n### 写文章\n\n1. 访问 `/admin/`，输入帐号密码登录\n2. 点击 **📝 文章管理**\n3. 点击 **New posts**\n4. 使用 Markdown 编辑器编写内容\n5. 保存为草稿或直接发布\n\n支持的功能：\n- Markdown 实时预览\n- 图片上传和管理\n- 标签和分类\n- 封面图设置\n- 文章目录\n\n### 管理页面\n\n1. 在后台选择 **📄 页面管理**\n2. 创建新页面（关于、联系等）\n3. 自定义 URL 路径\n\n### 修改主题和网站设置\n\n在后台选择 **⚙️ 网站设置**：\n\n| 设置 | 说明 |\n|------|------|\n| **基本设置** | 网站标题、描述 |\n| **🎨 主题设置** | 亮色/暗色、显示选项、首页信息 |\n| **🔗 导航菜单** | 添加、删除、排序菜单项 |\n\n### 管理员帐号管理\n\n```bash\n# 修改密码\nwrangler kv:key put --binding=AUTH_CREDENTIALS \"admin\" '{\"username\":\"新帐号\",\"password\":\"新密码\"}'\n\n# 添加用户\nwrangler kv:key put --binding=AUTH_CREDENTIALS \"user2\" '{\"username\":\"user2\",\"password\":\"密码2\"}'\n\n# 删除用户\nwrangler kv:key delete --binding=AUTH_CREDENTIALS \"user2\"\n\n# 查看所有用户\nwrangler kv:key list --binding=AUTH_CREDENTIALS\n```\n\n## 🔧 本地开发\n\n```bash\n# 安装 Hugo（如果没有）\nbrew install hugo  # macOS\n# 或\nsudo apt install hugo  # Linux\n\n# 启动开发服务器（包含草稿）\nhugo server -D\n\n# 浏览器打开 http://localhost:1313\n```\n\n### 常用命令\n\n```bash\n# 构建生产版本\nhugo --minify\n\n# 创建新文章\nhugo new content posts/my-new-post.md\n\n# 更新主题\nhugo mod get -u\n\n# 清理构建产物\nrm -rf public resources/_gen\n```\n\n## 📝 Markdown 写作\n\n### Front Matter 示例\n\n```yaml\n---\ntitle: \"文章标题\"\ndate: 2024-12-22T14:30:00+08:00\ndraft: false\ndescription: \"文章描述\"\ntags: [\"标签1\", \"标签2\"]\ncategories: [\"技术\"]\ncover:\n  image: \"\"\n  alt: \"\"\n  hidden: false\n---\n```\n\n### 支持的语法\n\n- **粗体**：`**粗体**`\n- *斜体*：`*斜体*`\n- `代码`：`` `代码` ``\n- [链接](https://example.com)：`[链接](https://example.com)`\n- 图片：`![alt](/images/xxx.jpg)`\n- 代码块：使用三个反引号\n- 表格：使用 Markdown 表格语法\n- 引用：使用 `\u003e` 前缀\n\n## ❓ 常见问题\n\n### Q: 后台登录失败怎么办？\n\n1. 检查 Cloudflare Pages Functions 是否正常运行\n2. 检查 KV 绑定是否正确配置\n3. 检查管理员帐号密码是否正确\n\n### Q: 如何修改密码？\n\n```bash\nwrangler kv:key put --binding=AUTH_CREDENTIALS \"admin\" '{\"username\":\"帐号\",\"password\":\"新密码\"}'\n```\n\n### Q: 图片存储在哪里？\n\n默认存储在 `static/images/uploads/` 目录，通过 Decap CMS 上传。\n\n### Q: 如何添加新的分类？\n\n在后台 **📝 文章管理** 中，点击分类下拉框的 **Add** 按钮。\n\n### Q: 本地开发时怎么用后台？\n\n本地开发时 Functions 无法使用。你可以临时修改 `config.yml` 使用 GitHub OAuth。\n\n## 🏗️ 架构说明\n\n```\n用户浏览器\n    ↓\nCloudflare Pages（静态博客 + Functions）\n    ↓ 登录验证\nCloudflare KV（存储帐号密码和 Session）\n    ↓ 编辑内容\nDecap CMS（后台管理）\n    ↓ 写入内容\nGitHub 仓库（存储 Markdown 文件）\n    ↓ 触发构建\nCloudflare Pages（自动部署）\n```\n\n## 📄 许可证\n\nMIT License\n\n## 🙏 致谢\n\n- [Hugo](https://gohugo.io/) — 静态站点生成器\n- [Decap CMS](https://decapcms.org/) — 开源内容管理系统\n- [PaperMod](https://github.com/adityatelange/hugo-PaperMod/) — 优秀的 Hugo 主题\n- [Cloudflare](https://www.cloudflare.com/) — 免费的 CDN、Pages 和 Functions"])</script><script>self.__next_f.push([1,"22:T6ed,# 你好，我是 F. B. Weber 👋\n\n\u003e ☁️ 独立开发者 · **无服务器技术爱好者** · 免费技术栈实践者\n\n我专注于构建运行在边缘节点上的应用——无需维护服务器，无需承担高昂账单，只需编写代码、部署并按需扩展。⚡\n\n---\n\n## 🛠️ 我使用的技术\n\n| 分类 | 技术 |\n|---|---|\n| ☁️ 无服务器 | Cloudflare Workers、Vercel Edge Functions、Deno Deploy |\n| 🖥️ 开发框架 | Hono、Next.js、Astro、Remix、Vue.js、Hugo |\n| 🗄️ 数据服务 | D1、KV、**R2 Storage**、Upstash、Turso、Neon |\n| ⚡ 编程语言 | TypeScript，以及少量 Rust |\n| 🚀 部署平台 | Cloudflare Pages、Vercel、GitHub Pages、GitHub Actions |\n\n## 📂 我的项目\n\n- **[blog-cms](https://github.com/fbwe425/blog-cms)** —— 基于 Hugo 和 Decap CMS 的博客系统，提供管理面板、深色/浅色主题与全文搜索\n- **[AueXUE](https://github.com/fbwe425/AueXUE)** —— 基于 Cloudflare R2 与 D1 的动态博客，支持 Obsidian 一键发布\n- **[fbwe425.github.io](https://github.com/fbwe425/fbwe425.github.io)** —— 我的个人博客与开发主页\n- **[XinghuisamaBlogs](https://github.com/fbwe425/fbwe425.github.io)** —— 基于 Next.js 的毛玻璃风格博客系统\n\n## 🌱 当前探索方向\n\n- 使用**免费服务层**构建完整的全栈应用\n- 探索 **Workers、D1 与 R2** 的边缘计算模式\n- 将 Obsidian 接入无服务器工作流 🎯\n- 使用 GitHub Actions 自动化构建与部署\n\n## 📫 联系我\n\n- 🐙 GitHub：[ @fbwe425](https://github.com/fbwe425)\n- 📧 邮箱：fbwe425@fnosmail.com\n\n---\n\n*最好的服务器，就是那台你永远不需要维护的服务器。* ☁️\n\n![访问量](https://img.shields.io/badge/profile-fbwe425-blue)23:Te15,"])</script><script>self.__next_f.push([1,"# 🚀 fbwe425.github.io\n\n\u003e ☁️ Personal homepage — **serverless developer portfolio**\n\n![GitHub Pages](https://img.shields.io/badge/GitHub%20Pages-Live-222222?style=for-the-badge\u0026logo=githubpages\u0026logoColor=white\u0026labelColor=0a0e1a)\n![HTML5](https://img.shields.io/badge/HTML5-E34F26?style=for-the-badge\u0026logo=html5\u0026logoColor=white)\n![CSS3](https://img.shields.io/badge/CSS3-1572B6?style=for-the-badge\u0026logo=css3\u0026logoColor=white)\n![JavaScript](https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge\u0026logo=javascript\u0026logoColor=black)\n\nMy personal portfolio site, built with **zero frameworks** — just clean HTML, CSS and a sprinkle of JavaScript. Deployed on **GitHub Pages** for free. ⚡\n\n**🔗 Live: https://fbwe425.github.io/**\n\n---\n\n## ✨ Features\n\n- 🌌 **Animated starfield** background (pure Canvas, no dependencies)\n- 🎨 **Dark theme** with Cloudflare-orange \u0026 edge-computing-teal accents\n- 📱 **Fully responsive** — works great on mobile, tablet and desktop\n- 🧭 **Smooth-scroll** single-page navigation\n- 🛠️ **Tech-stack showcase** — Cloudflare Workers, R2, Vercel, Hono, Next.js, Astro, Vue.js, Hugo, D1/KV, Upstash, Neon, TypeScript, Rust\n- 💬 **Contact section** — GitHub / Twitter / Email, one click away\n- 🌐 **Bilingual** — EN / 中文 toggle with localStorage persistence\n- 🚀 **Deploys itself** — push to `main` and GitHub Pages rebuilds automatically\n\n---\n\n## 📂 Featured Projects\n\nThis site showcases my serverless-focused projects:\n\n| Project | Description |\n|---------|-------------|\n| **[blog-cms](https://github.com/fbwe425/blog-cms)** | Hugo + Decap CMS blog with admin dashboard, dark/light theme, full-text search |\n| **[AueXUE](https://github.com/fbwe425/AueXUE)** | Dynamic blog on Cloudflare R2 + D1 with Obsidian plugin |\n\n---\n\n## 🗂️ Project structure\n\n```\nfbwe425.github.io/\n├── index.html   # The entire site — content + styles + animation\n├── README.md    # You are here\n└── LICENSE      # MIT License\n```\n\nThe whole site lives in a single `index.html` file (styles are embedded via `\u003cstyle\u003e`, the starfield via inline `\u003cscript\u003e`). That's the beauty of it — **no build step, no dependencies, no node_modules**. 🙌\n\n---\n\n## 🛠️ How to run locally\n\n```bash\n# Option 1: Python\npython3 -m http.server 8000\n# → open http://localhost:8000\n\n# Option 2: Node.js\nnpx serve .\n```\n\nOr just double-click `index.html` — it's fully static, no server needed.\n\n---\n\n## ✏️ Customize it\n\n| What you want to change | Where |\n|------------------------|-------|\n| **Your name / title** | `index.html` — `\u003ch1\u003e` in the hero section |\n| **Bio / subtitle** | `index.html` — `.subtitle` |\n| **Tech stack items** | `index.html` — `.stack-grid` block |\n| **Projects section** | `index.html` — `#projects` section |\n| **Colors** | `index.html` — CSS variables in `:root` (`--accent`, `--accent2`, ...) |\n| **Contact links** | `index.html` — `#contact` section |\n| **Starfield density** | `index.html` — `length: 160` in the script |\n\nAfter editing, commit \u0026 push to `main` — GitHub Pages picks it up automatically.\n\n---\n\n## 🌐 Deployment\n\nThis repo is served via [GitHub Pages](https://pages.github.com/) from the `main` branch at the repo root.\n\nSince the repo is named `fbwe425.github.io`, the site is automatically available at **https://fbwe425.github.io/** — no extra configuration needed.\n\n---\n\n## 📄 License\n\n[MIT](LICENSE) — use it, tweak it, make it yours. 🎉\n\n---\n\n*Built with ❤️ and the Cloudflare ☁️ spirit — \"The best server is the one you never have to manage.\"*"])</script><script>self.__next_f.push([1,"24:T3cf5,"])</script><script>self.__next_f.push([1,"# 🌟 欢迎使用 XHBlogs！\n\n这是一个采用 Next.js 构建的高颜值、毛玻璃（Glassmorphism）风格个人博客系统。本项目自带完善的前端展示与独立的本地后台控制台，支持 Markdown 沉浸式写作、草稿管理以及便捷的图床配置。\n\n本指南将带你从零开始，轻松部署并使用 XHBlogs。\n\n---\n## 语言\n\n[![English](https://img.shields.io/badge/Language-English-blue.svg)](README_en.md)\n[![中文](https://img.shields.io/badge/语言-中文-red.svg)](README.md)\n\n## 写在前面\n\n### 更新摘要 (版本0.3.1~0.3.2)\n\n#### 1. 新增个人关于动态\n\n\u003e 关于动态类贡献度及日志显示\n\n#### 2. 修复部分富文本编辑器bug\n\n\u003e 修补目前存在的编辑器bug，如超链接无法显示，引用无法显示等\n\n#### 3. 新增灵境与等级系统\n\n\u003e 类创意工坊功能，等级系统可在 设置-\u003e个人名片设置 中关闭\n\n#### 4. 网易云音乐显示bug，已修复\n\n\u003e 已更换API，修复网易云音乐显示bug。更新即可\n\n## 一、快速开始部署\n\n### 1. 环境配置\n\n在开始之前，请确保你的电脑已安装以下运行环境，否则后续程序将无法正常启动：\n\n- **Node.js** (推荐版本 v18.x 或以上)\n- **包管理器** (npm)\n- **Git** (用于拉取代码与版本控制)\n- **Python** (建议版本 3.10 及以上，本系统在 3.10 环境下测试通过)\n- *可选：云存储/图床服务（后续会有详细配置说明）*\n\n### 2. 博客源码更新\n\n为了让你能轻松跟上项目的最新功能，请使用更新器对源码进行更新！\n使用更新器，你不需要再手动对比代码、不用担心拉取更新会引发冲突，更不用害怕辛辛苦苦写的文章和配置文件被覆盖！\n\n🛠️ 更新步骤：\n\n第一步：获取无损更新器 (仅首次需要)\n\n#### 1 下载项目根目录下的 update.bat 和 update.py 文件。\n\n#### 2  将下载好的 update.bat 和 update.py 移动到你本地博客项目的最外层根目录（也就是和 my-blog-manager、XHBlogs 文件夹放在一起的地方）。\n\n如下图所示\n\n![img.png](picture/333.png)\n\n#### 3 双击update.bat文件实现更新，如果闪退 请使用cmd运行update.py文件\n\n### 3. 快速开始\n\n#### ① 启动脚本\n\n当你完成上述环境的配置后，恭喜你，最基础的准备工作已经搞定了！\n首先，进入 `my-blog-manager` 文件夹（**⚠️ 注意：请绝对不要重命名此文件夹，否则会导致环境路径解析失败！**）\n\n双击运行文件夹中的启动脚本：\n`Start.bat`\n脚本会自动检测并安装所需的依赖包。等待环境配置完成后，程序会自动唤起精美的后台控制台。\n\n#### ② 部署你的博客到 Vercel\n\n\u003e **提示**：本教程主要演示如何将项目部署至 Vercel，因为 Vercel 对 Next.js 框架有着最顶级的原生支持。\n\u003e\n\u003e **前提**：请确保已安装 Git，并拥有一个 GitHub 账号。**接下来的步骤请务必按顺序操作！**\n\n\u003e **请确保你已完成以下操作**：\n\u003e\n\u003e **第一步：本地全局配置**\n\n设置用户名\n\n`git config --global user.name \"你的Github用户名\"`\n\n设置邮箱（必须是你在 GitHub 绑定的邮箱）\n\n`git config --global user.email \"你绑定在Github的邮箱@example.com\"`\n\n\u003e **第二步：初始化本地仓库**\n\u003e\n\u003e 进入你的项目文件夹，执行以下CMD命令行操作：(及前端部署文件夹，这里是XHBlogs)\n\n1. 初始化 Git 仓库，生成隐藏的 .git 文件夹\n   `git init`\n2. 将所有文件添加到暂存区（注意后面有个点）\n   `git add .`\n3. 提交到本地版本库，并添加备注\n   `git commit -m \"first commit\"`\n\n**1. 配置本地物理路径**\n打开控制台的“设置”页面。\n在拉取的源码中，包含 `XHBlogs-mananger` 和 `XHBlogs` 两个核心文件夹。请在控制台中指定 `XHBlogs` 的本地物理路径。\n\n![选择物理路径](picture/Pasted%20image%2020260427111646.png)\n\n例如：`F:\\Test2\\XHBlogs`\n\n![填入本地BLOG物理路径](picture/Pasted%20image%2020260427112311.png)\n\n\u003e **关键步骤**：填入路径后，请务必点击 **[测试路径]** 进行连通性验证！！！验证通过后，再点击下方的 **[保存双轨配置]**。\n\n**2. 在 GitHub 创建私有仓库**\n登录 GitHub，新建一个用于托管博客源码的仓库（建议设置为 **Private 私有仓库** 以保护数据隐私）。\n\n![创建仓库](picture/Pasted%20image%2020260427112905.png)\n\n仓库名称可自定义。\n\n![仓库命名](picture/Pasted%20image%2020260427113030.png)\n\n获取该仓库的 SSH 地址，并将其复制粘贴到控制台的“B线”配置中：\n\n![复制SSH](picture/Pasted%20image%2020260427113120.png)\n\n源码分支填写为 `main`。确认无误后，再次点击 **[保存双轨配置]**。\n\n**3. 获取并配置部署密钥**\n点击控制台中的 **[获取B线专属密钥]** 按钮：\n\n![专属密钥](picture/98b965b5-6193-4690-a478-fe1a9abd594e.png)\n\n进入你的 GitHub 仓库页面，导航至 `Settings` -\u003e `Deploy keys` 界面：\n\n![Deploy Keys](picture/Pasted%20image%2020260427113705.png)\n\n将刚才复制的密钥填入 `Key` 框中，`Title` 可随意命名（例如：`XHBlogs-Deploy-Key`）。\n\n\u003e **🚨 严重警告**：下方的 **Allow write access** 选项必须勾选！！！\n\u003e 设置完毕后，点击 **Add key** 保存。\n\n**4. 初始化并推送源码**\n返回本地控制台，点击 **[智能初始化双轨环境]**，静待程序执行完毕。\n完成后，点击 **[仅同步源码]** 按钮：\n\n![仅同步源码](picture/Pasted%20image%2020260427121539.png)\n\n程序将开始向 GitHub 推送代码。**在此期间，请千万不要切换页面或关闭窗口**：\n\n![同步进度](picture/Pasted%20image%2020260427121702.png)\n\n进度条完成后，说明前端静态页面源码已成功托管至 GitHub。\n\n\u003e **此处可能出现无法推送bug**：\n\u003e\n\u003e **请尝试**\n\u003e\n\u003e 将SSH仓库地址改成如下图所示再进行初始化及同步源码\n\u003e\n\u003e ![img.png](picture/img.png)\n\n**5. 部署至 Vercel 平台**\n访问 Vercel 官网，注册账号并绑定你的 GitHub 授权！\n\n![绑定账号](picture/Pasted%20image%2020260427121844.png)\n\n点击 `Add New...` 添加一个新的 Project，在 Import 列表中选择你刚刚推送到 GitHub 的仓库：\n\n![导入项目](picture/Pasted%20image%2020260427121939.png)\n\n例如我选择的是 `XHBlogS2`：\n\n![选择项目](picture/Pasted%20image%2020260427122034.png)\n\n在 Framework Preset（框架预设）中选择 **Next.js**，然后点击 **Deploy** 按钮开始部署：\n\n![点击Deploy](picture/Pasted%20image%2020260427122141.png)\n\n静候 Vercel 服务器构建你的博客~~\n\n![部署中](picture/Pasted%20image%2020260427122245.png)\n\n撒花！部署成功后，点击预览图即可直接访问你的专属网站！\n\n![部署成功](picture/Pasted%20image%2020260427122338.png)\n\n在项目仪表盘（Dashboard）中，你可以随时查看部署状态与详细日志：\n\n![查看详情](picture/Pasted%20image%2020260427122453.png)\n\nVercel 默认会为你分配一个免费的二级域名：\n\n![分配域名](picture/Pasted%20image%2020260427122553.png)\n\n---\n\n### 问题 1：我要怎么样绑定自己的专属域名？\n\n**答：** 这里以“阿里云”购买的域名为例（其他服务商如腾讯云、Cloudflare 等操作逻辑基本一致）。\n\n首先登录阿里云控制台，进入【域名管理】页面：\n\n![域名管理](picture/Pasted%20image%2020260427123636.png)\n\n点击对应域名右侧的【解析】按钮：\n\n![点击解析](picture/Pasted%20image%2020260427123737.png)\n\n接着回到 Vercel，进入你的项目仪表盘，点击 **Settings**（或者直接点击域名旁的加号）：\n\n![点击加号](picture/Pasted%20image%2020260427123156.png)\n\n![进入设置](picture/Pasted%20image%2020260427123838.png)\n\n在 Domains 选项卡中，输入你购买的域名（例如我的是 `xinghuisama.top`），点击 **Add** 保存：\n\n![输入域名](picture/afb9fe5f-bf1e-4a8a-ae6b-379938f0924d.png)\n\n添加后，Vercel 会提供 `A` 记录和 `CNAME` 记录的配置参数。请将这些参数完整添加到阿里云的 DNS 解析设置中：\n\n![添加记录](picture/Pasted%20image%2020260427124533.png)\n\n\u003e **注意**：添加记录时，请务必仔细核去记录类型和记录值（Value）！\n\n配置完成后等待几分钟（DNS 传播需要时间），在 Vercel 页面点击 **Refresh** 刷新状态！！\n\n![Refresh](picture/Pasted%20image%2020260427124625.png)\n\n当状态显示为正常后，你就可以通过自己的专属域名访问博客了！（例如：`www.xinghuisama.top`）。\n\n---\n\n## 二、更新设置及上传文件\n\n为了保护数据安全，本控制台采用了**“操作暂存区”**机制。**请特别注意！！** 许多设置在修改后，必须主动执行“更新到本地”才能真正保存。需要执行此操作时，界面上方通常会有高亮提示。\n\n**操作示例：修改个人简介**\n\n![修改简介](picture/Pasted%20image%2020260427125314.png)\n\n修改内容后，点击 **[暂存到操作队列]**：\n\n![暂存队列](picture/Pasted%20image%2020260427125430.png)\n\n此时上方工具箱会提示待办操作。你可以随时撤销（清空全部），或者点击 **[更新本地]**。\n\n\u003e ⚠️ 注意：点击“更新本地”后，数据仅仅保存在了你的本地控制台环境中。\n\n如果你希望让这些修改在前端博客页面生效，你必须继续点击 **[同步 Blog]**（前提是前端博客的物理路径已正确配置）：\n\n![同步Blog](picture/Pasted%20image%2020260427125800.png)\n\n博客文章、说说（碎碎念）、杂谈等所有内容的发布与修改，均遵循此流程。\n\n\u003e **💡 黄金法则**：暂存队列 -\u003e 更新本地 -\u003e 同步Blog\n\n---\n\n## 三、如何推送你的修改到线上网页？\n\n当你在本地完成了满意的创作或设置调整，想要将其发布到公网让所有人看到时：\n\n请牢记，在执行了任何实质性修改并点击 **[同步Blog]** 后，请打开控制台的同步部署页面：\n\n![打开同步](picture/Pasted%20image%2020260427130216.png)\n\n确认“B线”地址正确无误，点击 **[仅同步源码]**。\n等待 GitHub Actions 或 Vercel 自动捕获更新。稍作喝杯茶的功夫，你就能在线上页面看到最新鲜的内容了！\n\n---\n\n## 四、图床配置\n\n为了优化写作体验，控制台深度整合了图床上传功能。本指南推荐使用“去不图床”（[https://7bu.top](https://7bu.top)）。\n如果你习惯使用纯外链，工具台也完美支持直接插入图片 URL。如果想接入其他支持标准 API 的图床，也欢迎极客们自行尝试。\n\n**配置流程：**\n\n![图床配置](picture/Pasted%20image%2020260427124930.png)\n\n填入对应的 API Token 等信息后，你可以点击 **[发送探针测试Token]**，实时检验图床接口是否畅通。\n\n---\n\n## 五、AI 猫猫助理设置\n\n博客系统内置了一只聪明的 AI 猫猫助理（默认接入 Gemini 模型）。极客玩家也可以通过修改源码接入其他大语言模型。\n\n首先，你需要申请一个 Gemini 的 API Key（申请教程网络资源丰富，在此不赘述）。拿到 API Key 后，在控制台进行如下配置：\n\n![猫猫设置](picture/Pasted%20image%2020260427134211.png)\n\n在本地设定好猫猫的专属系统提示词（性格）后，我们需要让线上环境也拥有调用 AI 的能力。请登录 Vercel：\n\n![Vercel环境](picture/Pasted%20image%2020260427134538.png)\n\n在项目设置中找到 `Environment Variables`（环境变量）：\n\n![搜索变量](picture/Pasted%20image%2020260427134633.png)\n\n进入你的博客工程详情：\n\n![项目工程](picture/Pasted%20image%2020260427134703.png)\n\n确保作用域（环境）包含线上环境，点击 **Add Environment Variables**：\n\n![添加变量](picture/Pasted%20image%2020260427135004.png)\n\n安全地注入你的密钥：\n\n- **Key** 输入：`GEMINI_API_KEY`\n- **Value** 输入：你的真实 API 密钥\n\n![输入API](picture/Pasted%20image%2020260427135044.png)\n\n点击保存。下一次重新部署时，猫猫助理就会在线上苏醒了。\n\n---\n\n## 六、评论系统配置\n\n本博客的评论系统基于 GitHub Issues（Gitalk 等类似方案）。你需要在 GitHub 创建一个 **Public（公开）** 仓库来专门存储网友的留言。\n\n在控制台评论设置中，填入你的 GitHub 用户名以及这个公开仓库的名称：\n\n![评论设置](picture/a3b44842-696b-4764-9cdf-882cd8792729.png)\n\n**接下来，配置 OAuth 授权以允许访客登录留言：**\n\n1. 登录 GitHub，点击右上角个人头像，进入 **Settings**（设置）。\n2. 滑动到左侧菜单栏最底部，点击 **Developer settings**。\n3. 在左侧选择 **OAuth Apps**，点击右上角的 **New OAuth App**。\n\n**关键应用信息填写指南：**\n\n\n| 字段名称                       | 填写建议                                                                           |\n| ------------------------------ | ---------------------------------------------------------------------------------- |\n| **Application name**           | 自定义名称，例如：`My-Blog-Comments`                                               |\n| **Homepage URL**               | 你的博客**首页完整地址** (例如 `https://www.xinghuisama.top`)                      |\n| **Application description**    | 可选填                                                                             |\n| **Authorization callback URL** | **核心参数**：必须填写你的博客域名。如果经常本地调试，可填 `http://localhost:3000` |\n\n**提取核心密钥：**\n\n1. 提交注册（Register application）。\n2. 在跳转页面即可看到 **Client ID**，这是所需的第一项数据。\n3. 点击下方的 **Generate a new client secret** 生成密钥。\n4. **🚨 立刻将这串密钥复制并妥善保存！** 出于安全机制，离开此页面后该密钥将永远隐藏。\n\n将这组 `Client ID` 和 `Client Secret` 准确填入控制台的对应栏目中，保存即可激活评论功能。\n\n---\n\n## 七、网易云音乐挂件设置\n\n![歌单设置](picture/Pasted%20image%2020260427141049.png)\n\n想给博客配上 BGM 吗？\n通过电脑浏览器打开 **网易云音乐网页版**。搜索并进入你喜欢的歌曲详情页，观察浏览器地址栏，URL 中的数字即为歌曲的专属 ID：\n\n![网易云ID](picture/Pasted%20image%2020260427141235.png)\n\n将这串 ID 复制并粘贴到控制台的搜索框中，即可一键将该歌曲收录进你的博客歌单库！\n\n![添加歌曲](picture/Pasted%20image%2020260427141356.png)\n\n---\n\n## 写在最后\n\nXHBLogs 还有诸多隐藏的细节功能，期待极客朋友们在实际使用中慢慢探索。本项目旨在提供一套开箱即用的前端静态展示与后台管理方案。如果你是资深开发者，觉得控制台操作仍有优化空间，完全可以基于 Next.js 源码进行二次开发，甚至手搓 Markdown 进行部署！\n\n**如果你觉得这个项目对你有帮助，请务必在 GitHub 上为我点亮一颗 ⭐ Star！每一颗星都是博主持续维护更新的最大动力。谢谢大家！**\n\n## 许可证\n\n[![License: CC BY-NC 4.0](https://img.shields.io/badge/License-CC%20BY--NC%204.0-lightgrey.svg)](https://creativecommons.org/licenses/by-nc/4.0/)\n\n\u003e 本项目采用 [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/) 许可协议。允许免费学习、分享和二次修改后发布（二次开源发布需提及原作者），但**严禁用于任何商业用途**。"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L1f\",null,{\"posts\":[{\"id\":\"auexue\",\"slug\":\"auexue\",\"title\":\"AueXUE — Dynamic Blog on Cloudflare\",\"type\":\"post\",\"date\":\"2026-08-27 15:00:00\",\"cover\":\"https://opengraph.githubassets.com/1/fbwe425/AueXUE\",\"content\":\"$20\"},{\"id\":\"blog-cms\",\"slug\":\"blog-cms\",\"title\":\"blog-cms — Hugo + Decap CMS Blog System\",\"type\":\"post\",\"date\":\"2026-08-28 10:00:00\",\"cover\":\"https://opengraph.githubassets.com/1/fbwe425/blog-cms\",\"content\":\"$21\"},{\"id\":\"github-profile\",\"slug\":\"github-profile\",\"title\":\"GitHub 个人主页介绍\",\"type\":\"post\",\"date\":\"2026-08-28 08:00:00\",\"cover\":\"https://o
