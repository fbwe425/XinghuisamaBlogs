name: Deploy XHBlogs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'XHBlogs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XHBlogs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: XHBlogs/package-lock.json

      - name: Patch next.config.ts for static export
        run: |
          cat > next.config.ts << 'CONF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: 'export',
            basePath: '',
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
          };

          export default nextConfig;
          CONF

      - name: Remove server-side API routes for static export
        run: rm -rf app/api

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Publish build to docs
        run: |
          touch out/.nojekyll
          rm -rf ../docs
          cp -a out ../docs
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'chore: deploy to GitHub Pages [skip ci]'
          git push origin HEAD:main
